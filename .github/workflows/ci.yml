name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          src: daemon

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile
        run: python -m compileall -q daemon

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build DivAcerManagerMax.slnx -c Release

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: for script in installer/*.sh; do bash -n "$script"; done
