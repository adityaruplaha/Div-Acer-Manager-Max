<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the daemon, which runs as root, may own the name -->
  <policy user="root">
    <allow own="io.github.PXDiv.DAMX"/>
  </policy>

  <!-- Anyone may call it; the daemon asks polkit before changing anything -->
  <policy context="default">
    <allow send_destination="io.github.PXDiv.DAMX"
           send_interface="io.github.PXDiv.DAMX"/>
    <allow send_destination="io.github.PXDiv.DAMX"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.PXDiv.DAMX"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
